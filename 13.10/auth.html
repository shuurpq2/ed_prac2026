<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <script>
        function cookie_write(key, value) {
            document.cookie = `${key}=${value}`
            console.log(`New cookie: ${key}=${value}\nAll cookies: ${document.cookie}`)
        }

        function auth_get_uuid(is_authorized) {
            let ans

            if (is_authorized) ans = crypto.randomUUID()

            return ans
        }

        function fictious_reg(name, password, email) {
            localStorage.setItem("name", name)
            localStorage.setItem("password", password)
            localStorage.setItem("email", email)
        }
    </script>
</body>
</html>
