<!DOCTYPE html>

<body>
    <script>
        function cookie_write(key, value) {
            document.cookie = `${key}=${value}`
            console.log(`New cookie: ${key}=${value}\nAll cookies: ${document.cookie}`)
        }
        
        cookie_write("newcock", "value")
    </script>
